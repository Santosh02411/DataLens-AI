# Always-on deployment on any Linux VPS (2 GB RAM recommended), with automatic HTTPS via Caddy.
# Usage: see deploy/vps/README.md  (or run deploy/vps/setup.sh)
services:
  app:
    build: ../..
    restart: always              # comes back after crashes and server reboots
    env_file: ../../backend/.env
    environment:
      TRUST_PROXY: "1"
      MAX_ROWS: "${MAX_ROWS:-250000}"
      MAX_DATASETS_IN_MEMORY: "${MAX_DATASETS_IN_MEMORY:-5}"
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  caddy:
    image: caddy:2
    restart: always
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: "${DOMAIN:-:80}"   # set DOMAIN=yourdomain.com for automatic HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  caddy_data:
  caddy_config:
